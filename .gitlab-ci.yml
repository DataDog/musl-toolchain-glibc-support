workflow:
  rules:
    # DDCI receives only stable-version tag events allowlisted for this
    # repository. GitLab does not preserve GitHub tag-ruleset restrictions.
    - if: >-
        $CI_COMMIT_TAG =~
        /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "external_pull_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
    - if: >-
        $CI_PIPELINE_SOURCE == "push" &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
        $CI_COMMIT_REF_PROTECTED == "true"
    - when: never

stages:
  - lint
  - test
  - stage
  - manifest
  - resolve
  - scan
  - publish

variables:
  CI_JOB_IMAGE: >-
    registry.ddbuild.io/docker:29.4.0-noble@sha256:3d4a9fb50befc45c91e5fd7d6ffad0df5f926506739f4ebd2537e95abaeacd52
  CI_SCANNER_IMAGE: >-
    registry.ddbuild.io/ci/images:1.2.13@sha256:ea0fcfc284d0021960a409755bef5f97559797355344a5e04a5670a256b76e0d
  BUILDKIT_SYNTAX: >-
    registry.ddbuild.io/images/mirror/docker/dockerfile:1@sha256:ecfaec9ed6d810b56388c508f4121597bfbba70d41a6dfeee4d8cad5f295fc32
  DD_PKG_IMAGE: 'registry.ddbuild.io/agent-delivery/dd-pkg:v0.9.3'
  GRADLE_ARGS: '--no-daemon'
  GRADLE_USER_HOME: '$CI_PROJECT_DIR/.gradle-home'
  GIT_DEPTH: '0'
  IMAGE_MIRROR: 'registry.ddbuild.io/images/mirror'
  MAVEN_REPOSITORY_PROXY: >-
    https://depot-read-api-java.us1.ddbuild.io/magicmirror/magicmirror/@current/
  SOURCE_IMAGE: >-
    registry.ddbuild.io/ci/musl-toolchain-glibc-support/musl-build-env
  PHP_SOURCE_IMAGE: >-
    registry.ddbuild.io/ci/musl-toolchain-glibc-support/php-buildonly

.validation-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "external_pull_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
    - when: never

.main-rules:
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "push" &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
        $CI_COMMIT_REF_PROTECTED == "true"
      interruptible: false
    - when: never

.release-rules:
  rules:
    - if: >-
        $CI_COMMIT_TAG =~
        /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
      interruptible: false
    - when: never

.docker-java-job:
  image: '$CI_JOB_IMAGE'
  interruptible: true
  cache:
    key:
      files:
        - test/gradle/wrapper/gradle-wrapper.properties
      prefix: gradle
    paths:
      - .gradle-home/caches/
      - .gradle-home/wrapper/
  before_script:
    - |
      set -euo pipefail
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
        'make=4.3-4.1build2' \
        'openjdk-17-jre-headless'
      rm -rf /var/lib/apt/lists/*
      export ORG_GRADLE_PROJECT_mavenRepositoryProxy="${MAVEN_REPOSITORY_PROXY}"
      docker --version
      docker buildx version
      java -version
  variables:
    KUBERNETES_POD_ANNOTATIONS_1: >-
      beta.fabric.datadoghq.com/no-proxy-additions=archive.ubuntu.com,
      security.ubuntu.com,download.docker.com,apt.releases.hashicorp.com,
      services.gradle.org,github.com,release-assets.githubusercontent.com
    KUBERNETES_CPU_REQUEST: '8'
    KUBERNETES_MEMORY_REQUEST: '24Gi'
    KUBERNETES_MEMORY_LIMIT: '30Gi'

.platform-build-and-test:
  extends: .docker-java-job
  tags:
    - 'docker-in-docker:$ARCH'
  timeout: 3h
  variables:
    DOCKER_LOOPBACK_SIZE: '60G'
    DOCKER_LOOPBACK_PATH: '/var'
  parallel:
    matrix:
      - ARCH:
          - amd64
          - arm64
  script:
    - &platform-build-and-test |
      set -euo pipefail
      source_image="${SOURCE_IMAGE}:${CI_COMMIT_SHA}-${ARCH}"
      php_image="${PHP_SOURCE_IMAGE}:${CI_COMMIT_SHA}-${ARCH}"

      case "${ARCH}" in
        amd64)
          musl_image_variable='MUSL_BUILD_ENV_AMD64_IMAGE'
          php_image_variable='PHP_BUILDONLY_AMD64_IMAGE'
          ;;
        arm64)
          musl_image_variable='MUSL_BUILD_ENV_ARM64_IMAGE'
          php_image_variable='PHP_BUILDONLY_ARM64_IMAGE'
          ;;
        *)
          echo "Unsupported CI architecture: ${ARCH}" >&2
          exit 1
          ;;
      esac

      musl_build_plan=$(ci/musl-build-plan)
      set -- ${musl_build_plan}
      test "$#" -eq 2
      case "$1" in build|reuse) ;; *) exit 1 ;; esac
      musl_build_mode=$1
      musl_source_commit=$2
      if [ "${musl_build_mode}" = reuse ]; then
        musl_source_tag="${SOURCE_IMAGE}:${musl_source_commit}"
        inspect_file=$(mktemp)
        trap 'rm -f "${inspect_file}"' EXIT
        if ! docker buildx imagetools inspect "${musl_source_tag}" \
            --format '{{json .Manifest}}' > "${inspect_file}"; then
          echo "No built musl-build-env index for ${musl_source_commit}" >&2
          exit 1
        fi
        jq -e '
          (.manifests | length) == 2 and
          ([.manifests[].platform | [.os, .architecture]] | sort) ==
            [["linux", "amd64"], ["linux", "arm64"]]
        ' "${inspect_file}"
        musl_source_digest=$(jq -er '.digest' "${inspect_file}")
        resolved_musl_image="${SOURCE_IMAGE}@${musl_source_digest}"
        ddsign verify "${resolved_musl_image}" --roles ci

        printf 'Reusing musl-build-env from %s: %s\n' \
          "${musl_source_commit}" "${resolved_musl_image}"
        make "test-php-buildonly-${ARCH}" \
          "${musl_image_variable}=${resolved_musl_image}" \
          "${php_image_variable}=${php_image}"
      else
        printf 'Building musl-build-env from current commit %s\n' \
          "${CI_COMMIT_SHA}"
        make "test-${ARCH}" \
          "${musl_image_variable}=${source_image}" \
          "${php_image_variable}=${php_image}"
      fi

lint:
  extends: .docker-java-job
  stage: lint
  tags:
    - 'arch:amd64'
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      interruptible: false
    - when: on_success
  variables:
    KUBERNETES_CPU_REQUEST: '4'
    KUBERNETES_MEMORY_REQUEST: '8Gi'
    KUBERNETES_MEMORY_LIMIT: '12Gi'
  script:
    - make lint

test:
  extends:
    - .platform-build-and-test
    - .validation-rules
  stage: test

stage-platform:
  extends:
    - .platform-build-and-test
    - .main-rules
  stage: stage
  variables:
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: musl-toolchain-glibc-support
  script:
    - *platform-build-and-test
    - |
      set -euo pipefail
      command -v docker-credential-ci

      source_image="${SOURCE_IMAGE}:${CI_COMMIT_SHA}-${ARCH}"
      php_image="${PHP_SOURCE_IMAGE}:${CI_COMMIT_SHA}-${ARCH}"

      docker push "${php_image}"
      php_digest=$(docker buildx imagetools inspect "${php_image}" \
        --format '{{.Manifest.Digest}}')
      printf 'Pushed %s@%s\n' "${php_image}" "${php_digest}"

      musl_build_plan=$(ci/musl-build-plan)
      set -- ${musl_build_plan}
      test "$#" -eq 2
      case "$1" in build|reuse) ;; *) exit 1 ;; esac
      if [ "$1" = build ]; then
        docker push "${source_image}"
        musl_digest=$(docker buildx imagetools inspect "${source_image}" \
          --format '{{.Manifest.Digest}}')
        printf 'Pushed %s@%s\n' "${source_image}" "${musl_digest}"
      fi

manifest:
  extends: .main-rules
  stage: manifest
  image: '$CI_JOB_IMAGE'
  tags:
    - 'arch:amd64'
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  needs:
    - stage-platform
  variables:
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: musl-toolchain-glibc-support
    KUBERNETES_CPU_REQUEST: '2'
    KUBERNETES_MEMORY_REQUEST: '4Gi'
    KUBERNETES_MEMORY_LIMIT: '6Gi'
  script:
    - |
      set -euo pipefail
      command -v docker-credential-ci

      temporary_directory=$(mktemp -d)
      trap 'rm -rf "${temporary_directory}"' EXIT

      inspect_index() {
        local -r index_image="$1"
        local -r inspect_file="$2"

        docker buildx imagetools inspect "${index_image}" \
          --format '{{json .Manifest}}' > "${inspect_file}"
        jq -e '
          (.manifests | length) == 2 and
          ([.manifests[].platform | [.os, .architecture]] | sort) ==
            [["linux", "amd64"], ["linux", "arm64"]]
        ' "${inspect_file}" > /dev/null
        jq -er '.digest' "${inspect_file}"
      }

      create_and_sign_index() {
        local -r image="$1"
        local -r name="$2"
        local -r amd64_image="${image}:${CI_COMMIT_SHA}-amd64"
        local -r arm64_image="${image}:${CI_COMMIT_SHA}-arm64"
        local -r index_image="${image}:${CI_COMMIT_SHA}"
        local -r metadata_file="${temporary_directory}/${name}-metadata.json"
        local -r inspect_file="${temporary_directory}/${name}-inspect.json"
        local digest
        local inspected_digest

        docker buildx imagetools create \
          --metadata-file "${metadata_file}" \
          --tag "${index_image}" \
          "${amd64_image}" \
          "${arm64_image}"

        digest=$(jq -er '
          .["containerimage.digest"] //
          .["containerimage.descriptor"].digest
        ' "${metadata_file}")
        inspected_digest=$(inspect_index "${index_image}" "${inspect_file}")
        test "${digest}" = "${inspected_digest}"

        # imagetools metadata is not buildx build metadata. Sign the exact
        # already-pushed digest, as dd-trace-php does for separately signed
        # images.
        ddsign sign "${index_image}@${digest}"
        printf 'Internal source index: %s@%s\n' "${image}" "${digest}"
      }

      tag_reused_index() {
        local -r image="$1"
        local -r source_commit="$2"
        local -r name="$3"
        local -r source_index="${image}:${source_commit}"
        local -r current_index="${image}:${CI_COMMIT_SHA}"
        local -r inspect_file="${temporary_directory}/${name}-inspect.json"
        local source_digest
        local current_digest

        source_digest=$(inspect_index "${source_index}" "${inspect_file}")
        ddsign verify "${image}@${source_digest}" --roles ci

        # Signatures cover digests, so the identical index needs only a new
        # commit-addressed tag, not another signature.
        docker buildx imagetools create \
          --tag "${current_index}" \
          "${image}@${source_digest}"
        current_digest=$(inspect_index "${current_index}" "${inspect_file}")
        test "${current_digest}" = "${source_digest}"
        ddsign verify "${image}@${current_digest}" --roles ci

        printf 'Reused internal source index: %s@%s\n' \
          "${current_index}" "${current_digest}"
      }

      musl_build_plan=$(ci/musl-build-plan)
      set -- ${musl_build_plan}
      test "$#" -eq 2
      case "$1" in build|reuse) ;; *) exit 1 ;; esac
      musl_build_mode=$1
      musl_source_commit=$2
      if [ "${musl_build_mode}" = build ]; then
        create_and_sign_index "${SOURCE_IMAGE}" musl-build-env
      else
        tag_reused_index \
          "${SOURCE_IMAGE}" "${musl_source_commit}" musl-build-env
      fi
      create_and_sign_index "${PHP_SOURCE_IMAGE}" php-buildonly

resolve-release:
  extends: .release-rules
  stage: resolve
  image: '$CI_JOB_IMAGE'
  tags:
    - 'arch:amd64'
  variables:
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: musl-toolchain-glibc-support
    KUBERNETES_CPU_REQUEST: '1'
    KUBERNETES_MEMORY_REQUEST: '2Gi'
    KUBERNETES_MEMORY_LIMIT: '4Gi'
  script:
    - |
      set -euo pipefail
      command -v docker-credential-ci

      temporary_directory=$(mktemp -d)
      trap 'rm -rf "${temporary_directory}"' EXIT

      resolve_release_source() {
        local -r image="$1"
        local -r name="$2"
        local -r variable_prefix="$3"
        local -r source_tag="${image}:${CI_COMMIT_SHA}"
        local -r inspect_file="${temporary_directory}/${name}.json"
        local digest

        docker buildx imagetools inspect "${source_tag}" \
          --format '{{json .Manifest}}' > "${inspect_file}"
        jq -e '
          (.manifests | length) == 2 and
          ([.manifests[].platform | [.os, .architecture]] | sort) ==
            [["linux", "amd64"], ["linux", "arm64"]]
        ' "${inspect_file}"

        digest=$(jq -er '.digest' "${inspect_file}")
        printf '%s_RELEASE_DIGEST=%s\n' \
          "${variable_prefix}" "${digest}" >> release.env
        printf '%s_RELEASE_SOURCE=%s@%s\n' \
          "${variable_prefix}" "${image}" "${digest}" >> release.env
        printf 'Resolved %s release source: %s@%s\n' \
          "${name}" "${image}" "${digest}"
      }

      : > release.env
      resolve_release_source \
        "${SOURCE_IMAGE}" musl-build-env MUSL_BUILD_ENV
      resolve_release_source \
        "${PHP_SOURCE_IMAGE}" php-buildonly PHP_BUILDONLY
  artifacts:
    reports:
      dotenv: release.env
    expire_in: 1 day

scan-release:
  extends: .release-rules
  stage: scan
  image: '$CI_SCANNER_IMAGE'
  tags:
    - 'arch:amd64'
  needs:
    - job: resolve-release
      artifacts: true
  variables:
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: musl-toolchain-glibc-support
    KUBERNETES_CPU_REQUEST: '2'
    KUBERNETES_MEMORY_REQUEST: '4Gi'
    KUBERNETES_MEMORY_LIMIT: '6Gi'
  script:
    - |
      set -euo pipefail
      scan_directory=$(mktemp -d)
      trap 'rm -rf "${scan_directory}"' EXIT

      scan_release_source() {
        local -r source="$1"
        local -r digest="$2"
        local -r repository="$3"
        local -r dockerfile="$4"
        local -r name="${repository##*/}"
        local -r scan_result="${scan_directory}/${name}.json"

        ddsign verify "${source}" --roles ci
        imageinspector scan \
          --registry registry.ddbuild.io \
          --repository "${repository}" \
          --digest "${digest}" \
          --build-repository DataDog/musl-toolchain-glibc-support \
          --build-definition-file "${dockerfile}" \
          --build-pipeline-url "${CI_PIPELINE_URL}" > "${scan_result}"

        test -s "${scan_result}"
        if ! jq -e '
          type == "object" and
          has("should_block") and
          (.should_block == false)
        ' "${scan_result}" > /dev/null; then
          echo "imageinspector blocked or returned no result for ${name}" >&2
          jq . "${scan_result}" || cat "${scan_result}"
          exit 1
        fi
      }

      scan_release_source \
        "${MUSL_BUILD_ENV_RELEASE_SOURCE}" \
        "${MUSL_BUILD_ENV_RELEASE_DIGEST}" \
        ci/musl-toolchain-glibc-support/musl-build-env \
        musl-build-env/Dockerfile
      scan_release_source \
        "${PHP_BUILDONLY_RELEASE_SOURCE}" \
        "${PHP_BUILDONLY_RELEASE_DIGEST}" \
        ci/musl-toolchain-glibc-support/php-buildonly \
        php-buildonly/Dockerfile

publish-release:
  extends: .release-rules
  stage: publish
  image: '$DD_PKG_IMAGE'
  tags:
    - 'arch:arm64'
  needs:
    - job: resolve-release
      artifacts: true
    - job: scan-release
      artifacts: false
  resource_group: musl-build-env-publication
  timeout: 135m
  variables:
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: musl-toolchain-glibc-support
    KUBERNETES_POD_ANNOTATIONS_1: >-
      beta.fabric.datadoghq.com/no-proxy-additions=hub.docker.com
    KUBERNETES_CPU_REQUEST: '1'
    KUBERNETES_MEMORY_REQUEST: '2Gi'
    KUBERNETES_MEMORY_LIMIT: '4Gi'
    PUBLIC_IMAGES_PUBLISH_TIMEOUT: '1800'
  script:
    - |
      set -euo pipefail
      temporary_directory=$(mktemp -d)
      trap 'rm -rf "${temporary_directory}"' EXIT

      check_public_version() {
        local -r image="$1"
        local -r release_digest="$2"
        local -r tag_response="${temporary_directory}/${image}-tag.json"
        local status
        local public_digest

        status=$(
          curl -sS --output "${tag_response}" \
            --write-out '%{http_code}' \
            "https://hub.docker.com/v2/repositories/datadog/${image}/tags/${CI_COMMIT_TAG}"
        )

        case "${status}" in
          200)
            public_digest=$(
              perl -MJSON::PP -0777 \
                -ne 'print decode_json($_)->{"digest"}' "${tag_response}"
            )
            test -n "${public_digest}"
            if [ "${public_digest}" != "${release_digest}" ]; then
              echo "Refusing to overwrite ${image}:${CI_COMMIT_TAG}" >&2
              echo "Docker Hub digest: ${public_digest}" >&2
              echo "Release digest:    ${release_digest}" >&2
              exit 1
            fi
            ;;
          404)
            ;;
          *)
            echo "Docker Hub preflight for ${image} returned HTTP ${status}" >&2
            cat "${tag_response}" >&2
            exit 1
            ;;
        esac
      }

      publish_version() {
        local -r registries="$1"
        local -r source="$2"
        local -r image="$3"

        dd-pkg publish-image \
          --timeout "${PUBLIC_IMAGES_PUBLISH_TIMEOUT}" \
          --poll-interval 30 \
          --registries "${registries}" \
          --sources "${source}" \
          --destinations "${image}:${CI_COMMIT_TAG}" \
          --merge-strategy none \
          --signing=false
      }

      publish_latest() {
        local -r registries="$1"
        local -r image="$2"

        dd-pkg publish-image \
          --timeout "${PUBLIC_IMAGES_PUBLISH_TIMEOUT}" \
          --poll-interval 30 \
          --registries "${registries}" \
          --tag-reference "${image}:${CI_COMMIT_TAG}" \
          --new-tags latest \
          --signing=false
      }

      check_public_version \
        musl-build-env "${MUSL_BUILD_ENV_RELEASE_DIGEST}"
      check_public_version \
        php-buildonly "${PHP_BUILDONLY_RELEASE_DIGEST}"

      dd-pkg version
      publish_version \
        public "${MUSL_BUILD_ENV_RELEASE_SOURCE}" musl-build-env
      publish_version \
        dockerhub "${PHP_BUILDONLY_RELEASE_SOURCE}" php-buildonly

      # Do not advance either mutable alias until both immutable versions exist.
      publish_latest public musl-build-env
      publish_latest dockerhub php-buildonly
